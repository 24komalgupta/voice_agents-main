# Example Cloudflare named-tunnel config for a stable public hostname.
# Copy this to ~/.cloudflared/config.yml and replace the hostname with your own.
# You also need the generated credentials JSON file for the tunnel in ~/.cloudflared/.

tunnel: rider-agent
credentials-file: /Users/your-user/.cloudflared/<your-tunnel-id>.json

ingress:
  - hostname: rider-agent.example.com
    service: http://localhost:8000
  - service: http_status:404
